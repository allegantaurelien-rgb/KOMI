<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frigo">
<title>Le Frigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js" defer></script>
<style>
:root{
  --bg:#E9F0EC; --ink:#14302A; --muted:#5E7A72; --line:#C9D8D1;
  --spruce:#1F4D43; --paper:#F8FBF9;
  --fresh:#3E9B6B; --soon:#E8A317; --urgent:#D6452B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:calc(150px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--spruce);outline-offset:2px}

header{padding:calc(20px + env(safe-area-inset-top)) 20px 14px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
#summary{margin:8px 0 0;color:var(--muted);font-size:15px}
#summary b{color:var(--urgent);font-weight:600}

section{display:none;padding:0 20px}
section.on{display:block}

/* Lignes du frigo : une bande de fraîcheur qui raccourcit avec le temps */
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item .top{display:flex;gap:12px;align-items:center;cursor:pointer}
.item img{width:48px;height:48px;object-fit:contain;background:var(--paper);border-radius:6px;flex:none}
.item .ph{width:48px;height:48px;border-radius:6px;background:var(--paper);flex:none}
.item .name{font-weight:600;font-size:17px;line-height:1.2}
.item .meta{color:var(--muted);font-size:14px;margin-top:2px}
.item .qty{margin-left:auto;font-weight:800;font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fresh)}
.soon .bar i{background:var(--soon)} .urgent .bar i{background:var(--urgent)}
.when{font-size:14px;font-weight:600;color:var(--fresh)}
.soon .when{color:#A06F00} .urgent .when{color:var(--urgent)}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.acts{display:flex;gap:8px}
.btn{border:1.5px solid var(--spruce);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.fill{background:var(--spruce);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.empty{padding:48px 8px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5}

/* Courses */
.add{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password]{
  width:100%;padding:12px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.course{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:17px}
.course input{width:22px;height:22px;accent-color:var(--spruce);flex:none}
.course.done span{text-decoration:line-through;color:var(--muted)}
.course .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--muted);padding:4px 8px;cursor:pointer}

/* Saison */
.months{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.months button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.months button.on{background:var(--spruce);border-color:var(--spruce);color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols h2{font-size:18px;margin:0 0 8px}
.cols ul{margin:0;padding:0;list-style:none}
.cols li{padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}

/* Recettes */
.rec-form{margin-bottom:18px}
.rec-form input{max-width:100%}
.rec-form button:disabled{opacity:.6;cursor:wait}
.rec-alert{background:#FBE9E5;color:#8E2A16;padding:10px 12px;border-radius:10px;font-size:15px;margin:0 0 12px}
.rec{border-bottom:1px solid var(--line);padding:4px 0}
.rec summary{display:flex;justify-content:space-between;gap:12px;align-items:baseline;cursor:pointer;padding:12px 0;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.rt{font-weight:600;font-size:18px;line-height:1.25}
.rm{color:var(--muted);font-size:14px;flex:none}
.rec p{margin:6px 0;font-size:15px}
.rec ol{padding-left:20px;margin:10px 0 14px;line-height:1.5;font-size:16px}
.rec-when{color:var(--muted);font-size:13px;margin-top:14px}

/* Navigation */
/* Menu en bas de l'écran (plus de badge d'hébergeur qui gêne sur GitHub Pages) */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--spruce);
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:#B8D3C9;padding:16px 0;font-weight:600;font-size:15px;cursor:pointer}
nav button.on{color:#fff;box-shadow:inset 0 3px 0 #fff}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  border:0;background:var(--ink);color:#fff;font-size:32px;line-height:1;cursor:pointer;display:none;
  box-shadow:0 6px 16px rgba(20,48,42,.35)}
#fab.on{display:block}

/* Fenêtres */
dialog{border:0;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;margin:auto auto 0;background:var(--bg);color:var(--ink)}
.editing .addonly{display:none}
.searchrow{display:flex;gap:8px}
.sugg{margin-top:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);max-height:260px;overflow-y:auto}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer;font-size:15px}
.sugg button:last-child{border-bottom:0}
.sugg img,.sugg i{width:36px;height:36px;object-fit:contain;flex:none}
.sugg small{color:var(--muted)}
.sugg .none{padding:14px;color:var(--muted);font-size:15px}
dialog::backdrop{background:rgba(20,48,42,.5)}
dialog h2{margin:0 0 14px;font-size:22px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#reader{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
#reader video{width:100%;height:100%;object-fit:cover;display:block}
#reader .guide{position:absolute;left:6%;width:88%;top:25%;height:50%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none}
.found{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;background:var(--paper);border-radius:10px}
.found img{width:44px;height:44px;object-fit:contain}
.found small{color:var(--muted)}
.found.note{display:block;font-size:15px;line-height:1.4}
.found.err{background:#FBE9E5;color:#8E2A16}
.foot{display:flex;gap:10px;margin-top:20px}
.foot .btn{flex:1;padding:13px;font-size:16px}
/* Le message est un "popover" : il s'affiche aussi au-dessus des fenêtres de saisie */
#toast{position:fixed;inset:auto;margin:0;border:0;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;z-index:50;max-width:90%;width:max-content}
#toast.on{opacity:1}
#toast:popover-open{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1 id="title">Frigo</h1>
  <p id="summary"></p>
</header>

<section id="s-frigo" class="on"><div id="frigo"></div></section>

<section id="s-courses">
  <div class="add">
    <input type="text" id="newCourse" placeholder="Ajouter un article" enterkeyhint="done">
    <button class="btn fill" id="addCourse">Ajouter</button>
  </div>
  <div id="courses"></div>
  <p><button class="btn ghost" id="clearDone">Vider les articles cochés</button></p>
</section>

<section id="s-saison">
  <div class="months" id="months"></div>
  <div class="cols">
    <div><h2>Fruits</h2><ul id="fruits"></ul></div>
    <div><h2>Légumes</h2><ul id="legumes"></ul></div>
  </div>
</section>

<section id="s-recettes">
  <div class="rec-form">
    <label for="personnes">Pour combien de personnes ?</label>
    <input type="number" id="personnes" min="1" max="12" value="4" inputmode="numeric">
    <label for="envie">Une envie ? (facultatif)</label>
    <input type="text" id="envie" placeholder="rapide, sans four, plat froid…" maxlength="120">
    <button class="btn fill" id="getRec" style="width:100%;margin-top:14px;padding:13px;font-size:16px">Proposer des recettes</button>
  </div>
  <div id="recettes"></div>
</section>

<button id="fab" class="on" aria-label="Ajouter un produit">+</button>

<nav>
  <button data-tab="frigo" class="on">Frigo</button>
  <button data-tab="courses">Courses</button>
  <button data-tab="recettes">Recettes</button>
  <button data-tab="saison">Saison</button>
</nav>

<!-- Ajout produit -->
<dialog id="dlgAdd">
  <h2 id="dlgTitle">Ajouter au frigo</h2>
  <div id="reader" hidden><video id="cam" playsinline muted autoplay></video><div class="guide"></div></div>
  <div class="addonly">
    <button class="btn fill" id="scanBtn" style="width:100%;padding:12px">Scanner un code-barres</button>
    <label for="search">Ou chercher par nom</label>
    <div class="searchrow">
      <input type="text" id="search" placeholder="Yaourt nature Danone" enterkeyhint="search">
      <button class="btn" id="searchBtn">Chercher</button>
    </div>
    <div id="sugg" class="sugg" hidden></div>
  </div>
  <label for="code">Code-barres (facultatif)</label>
  <input type="text" id="code" inputmode="numeric" placeholder="3017620422003">
  <div id="found"></div>
  <label for="nom">Produit</label>
  <input type="text" id="nom" placeholder="Yaourt nature">
  <label for="marque">Marque</label>
  <input type="text" id="marque" placeholder="Danone">
  <label for="qte">Quantité</label>
  <input type="number" id="qte" value="1" min="1" inputmode="numeric">
  <label for="dlc">Date de péremption</label>
  <input type="date" id="dlc">
  <div class="chips">
    <button class="btn ghost" data-plus="3">+3 j</button>
    <button class="btn ghost" data-plus="7">+1 sem</button>
    <button class="btn ghost" data-plus="14">+2 sem</button>
    <button class="btn ghost" data-plus="30">+1 mois</button>
  </div>
  <div class="foot">
    <button class="btn ghost" id="cancelAdd">Annuler</button>
    <button class="btn fill" id="saveAdd">Ajouter au frigo</button>
  </div>
  <button class="btn addonly" id="saveNext" style="width:100%;margin-top:10px;padding:12px;font-size:16px">Ajouter et scanner le suivant</button>
</dialog>

<!-- Réglages -->
<dialog id="dlgCfg">
  <h2>Connexion</h2>
  <div id="cfgUrlBox">
    <label for="cfgUrl">Adresse de l'API (URL Apps Script)</label>
    <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
  </div>
  <label for="cfgPin">Code secret</label>
  <input type="password" id="cfgPin" autocomplete="off">
  <div class="foot"><button class="btn fill" id="saveCfg">Enregistrer</button></div>
</dialog>

<div id="toast" popover="manual" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Colle ici l'URL de ton déploiement Apps Script (celle qui finit par /exec).
// L'app ne demandera plus que le code secret, une seule fois par appareil.
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzUEIoo6Q_QVP5y-JP3SqhpyDYch-0mRlK3LtY7pZh4SGbBW1zxz2JAshdaQ2u35oHBvQ/exec';   // ex. 'https://script.google.com/macros/s/XXXX/exec'

let CFG = {};
try { CFG = JSON.parse(localStorage.getItem('frigo_cfg') || '{}'); } catch (e) {}
// Lien de configuration à envoyer à la famille : https://ton-site/#u=URL_ENCODEE&p=CODE
(function () {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('u')) {
    CFG = { url: h.get('u'), pin: h.get('p') || '' };
    try { localStorage.setItem('frigo_cfg', JSON.stringify(CFG)); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }
})();
if (DEFAULT_URL) CFG.url = DEFAULT_URL;
function openCfg() {
  $('cfgUrl').value = CFG.url || '';
  $('cfgUrlBox').hidden = !!DEFAULT_URL;          // URL déjà connue : on ne demande que le code
  $('cfgPin').value = '';
  if (!$('dlgCfg').open) $('dlgCfg').showModal();
}
let state = JSON.parse(localStorage.getItem('frigo_state') || '{"frigo":[],"courses":[]}');
let draft = {};          // infos Open Food Facts du produit en cours d'ajout

/* ---------- API ---------- */
// Les appels partent l'un après l'autre : on peut enchaîner les scans sans perdre de produit
let chain = Promise.resolve();
function api(action, data = {}) {
  if (action === 'recipes') return apiRaw(action, data);   // long : ne bloque pas les autres actions
  const p = chain.then(() => apiRaw(action, data));
  chain = p.catch(() => {});
  return p;
}
async function apiRaw(action, data) {
  if (!CFG.url || !CFG.pin) { openCfg(); return null; }
  try {
    // Corps en texte brut : évite la requête préliminaire CORS refusée par Apps Script
    const res = await fetch(CFG.url, { method: 'POST', body: JSON.stringify({ action, token: CFG.pin, ...data }) });
    const txt = await res.text();
    let json;
    try { json = JSON.parse(txt); }
    catch (e) { toast("L'API ne répond pas : ouvre le déploiement à « Tout le monde » et publie une nouvelle version."); return null; }
    if (json.error) {
      toast(json.error);
      if (json.error === 'Code incorrect') openCfg();   // on redemande le code
      return null;
    }
    if (json.recettes) return json;          // réponse « recettes » : ne remplace pas le frigo
    state = json;
    try { localStorage.setItem('frigo_state', JSON.stringify(state)); } catch (e) {}
    render();
    return json;
  } catch (e) { toast('Pas de connexion à l\'API. Vérifie l\'URL en /exec et ta connexion.'); return null; }
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg;
  try { if (!t.matches(':popover-open')) t.showPopover(); } catch (e) { t.classList.add('on'); }
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { try { t.hidePopover(); } catch (e) {} t.classList.remove('on'); }, 2800);
}

/* ---------- Dates ---------- */
function daysLeft(str) {
  if (!str) return null;
  const [y, m, d] = String(str).split('-').map(Number);
  if (!y) return null;
  const now = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
}
function whenLabel(d) {
  if (d === null) return 'Pas de date';
  if (d < 0) return `Périmé depuis ${-d} j`;
  if (d === 0) return "À consommer aujourd'hui";
  if (d === 1) return 'À consommer demain';
  return `Dans ${d} jours`;
}
function isoPlus(n) {
  const d = new Date(); d.setDate(d.getDate() + n);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

/* ---------- Rendu ---------- */
function render() { renderFrigo(); renderCourses(); }

function renderFrigo() {
  const items = state.frigo.map(i => ({ ...i, d: daysLeft(i.date_peremption) }))
    .sort((a, b) => (a.d ?? 9999) - (b.d ?? 9999));
  const urgent = items.filter(i => i.d !== null && i.d <= 3).length;
  $('summary').innerHTML = !items.length ? 'Le frigo est vide'
    : urgent ? `<b>${urgent} produit${urgent > 1 ? 's' : ''} à consommer sous 3 jours</b>`
    : `${items.length} produit${items.length > 1 ? 's' : ''}, rien d'urgent`;

  if (!items.length) {
    $('frigo').innerHTML = '<div class="empty">Rien dans le frigo pour l\'instant.<br>Appuie sur + pour scanner un produit.</div>';
    return;
  }
  $('frigo').innerHTML = items.map(i => {
    const tone = i.d !== null && i.d <= 1 ? 'urgent' : i.d !== null && i.d <= 3 ? 'soon' : '';
    const pct = i.d === null ? 100 : Math.max(4, Math.min(100, (i.d / 14) * 100));
    return `<div class="item ${tone}">
      <div class="top" data-edit="${esc(i.id)}" role="button" tabindex="0" aria-label="Modifier ${esc(i.nom)}">
        ${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
        <div><div class="name">${esc(i.nom)}</div><div class="meta">${esc(i.marque)}${i.nutriscore ? ' · Nutri-Score ' + esc(String(i.nutriscore).toUpperCase()) : ''}</div></div>
        <div class="qty">×${esc(i.quantite)}</div>
      </div>
      <div class="bar"><i style="width:${i.d === null ? 0 : pct}%"></i></div>
      <div class="row">
        <span class="when">${whenLabel(i.d)}</span>
        <div class="acts">
          <button class="btn ghost" data-edit="${esc(i.id)}">Modifier</button>
          <button class="btn" data-eat="${esc(i.id)}">Mangé</button>
          <button class="btn ghost" data-bin="${esc(i.id)}">Jeté</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderCourses() {
  const list = [...state.courses].sort((a, b) => Number(a.fait === true || a.fait === 'TRUE') - Number(b.fait === true || b.fait === 'TRUE'));
  if (!list.length) { $('courses').innerHTML = '<div class="empty">La liste est vide.</div>'; return; }
  $('courses').innerHTML = list.map(c => {
    const done = c.fait === true || c.fait === 'TRUE';
    return `<div class="course ${done ? 'done' : ''}">
      <input type="checkbox" ${done ? 'checked' : ''} data-tog="${esc(c.id)}" aria-label="Coché">
      <span>${esc(c.article)}${Number(c.quantite) > 1 ? ' ×' + esc(c.quantite) : ''}</span>
      <button class="x" data-del="${esc(c.id)}" aria-label="Supprimer">×</button>
    </div>`;
  }).join('');
}

/* ---------- Saison (France métropolitaine) ---------- */
const MOIS = ['Janv.', 'Févr.', 'Mars', 'Avr.', 'Mai', 'Juin', 'Juil.', 'Août', 'Sept.', 'Oct.', 'Nov.', 'Déc.'];
const SAISON = [
  { f: 'Pomme, Poire, Orange, Clémentine, Kiwi, Citron, Pamplemousse', l: 'Carotte, Chou, Chou-fleur, Poireau, Endive, Épinard, Navet, Betterave, Céleri-rave, Panais, Potiron' },
  { f: 'Pomme, Poire, Orange, Citron, Kiwi, Pamplemousse, Clémentine', l: 'Carotte, Chou, Chou-fleur, Poireau, Endive, Épinard, Navet, Betterave, Panais, Topinambour' },
  { f: 'Pomme, Poire, Kiwi, Citron, Pamplemousse, Orange', l: 'Carotte, Chou, Poireau, Endive, Épinard, Radis, Navet, Betterave, Champignon, Blette' },
  { f: 'Pomme, Kiwi, Rhubarbe, Citron, Fraise', l: 'Asperge, Radis, Épinard, Laitue, Carotte, Blette, Artichaut, Navet, Poireau' },
  { f: 'Fraise, Rhubarbe, Cerise', l: 'Asperge, Artichaut, Radis, Petit pois, Fève, Laitue, Épinard, Carotte, Chou-rave, Blette' },
  { f: 'Fraise, Cerise, Abricot, Framboise, Melon, Rhubarbe, Groseille', l: 'Courgette, Haricot vert, Petit pois, Concombre, Tomate, Radis, Artichaut, Fève, Laitue, Chou-fleur' },
  { f: 'Pêche, Abricot, Nectarine, Framboise, Cerise, Melon, Pastèque, Prune, Myrtille, Groseille', l: 'Tomate, Courgette, Aubergine, Poivron, Concombre, Haricot vert, Maïs, Salade, Radis, Fenouil' },
  { f: 'Pêche, Nectarine, Prune, Melon, Pastèque, Mûre, Figue, Raisin, Framboise, Myrtille', l: 'Tomate, Courgette, Aubergine, Poivron, Concombre, Haricot vert, Maïs, Fenouil, Brocoli, Blette' },
  { f: 'Raisin, Figue, Prune, Poire, Pomme, Mûre, Noisette, Mirabelle, Quetsche', l: 'Tomate, Courgette, Aubergine, Poivron, Haricot vert, Brocoli, Chou-fleur, Champignon, Potiron, Poireau, Carotte' },
  { f: 'Pomme, Poire, Raisin, Coing, Noix, Châtaigne, Kiwi, Figue', l: 'Potiron, Courge, Butternut, Chou, Chou-fleur, Brocoli, Poireau, Carotte, Champignon, Épinard, Betterave, Céleri, Panais, Fenouil' },
  { f: 'Pomme, Poire, Kiwi, Clémentine, Châtaigne, Noix, Coing', l: 'Potiron, Courge, Chou, Chou-fleur, Poireau, Carotte, Betterave, Céleri, Endive, Épinard, Navet, Panais, Topinambour, Salsifis' },

/* ---------- Scan + Open Food Facts ---------- */
// Message affiché DANS la fenêtre (un petit message qui disparaît se rate trop facilement)
function note(html, kind) {
  $('found').innerHTML = `<div class="found note ${kind || ''}">${html}</div>`;
}

/* Lecteur de code-barres : zxing-wasm (plus robuste que les lecteurs JS) + caméra gérée directement */
let scanning = false, scanToken = 0, stream = null, zxReady = null, lastLookup = '';
const ZX_OPTS = { formats: ['EAN-13', 'EAN-8', 'UPC-A', 'UPC-E'], tryHarder: true, maxNumberOfSymbols: 1 };

function loadZX() {
  if (!zxReady) zxReady = (async () => {
    if (typeof ZXingWASM === 'undefined') return false;
    try { await ZXingWASM.prepareZXingModule({ fireImmediately: true }); return true; } catch (e) { return false; }
  })();
  return zxReady;
}
window.addEventListener('load', () => { loadZX(); });        // préchargé : la caméra s'ouvre sans attendre

// Partie de l'image réellement visible dans le carré d'aperçu (object-fit: cover)
function visibleRect(vw, vh) {
  if (vw > vh) { const w = vh; return { x: (vw - w) / 2, y: 0, w, h: vh }; }
  const h = vw; return { x: 0, y: (vh - h) / 2, w: vw, h };
}
// Flou 3x3 : le grain du capteur gêne la lecture des barres fines, un léger flou la rend plus fiable
function blur3(img) {
  const { data, width: w, height: h } = img;
  const g = new Float32Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = data[j] * 0.299 + data[j + 1] * 0.587 + data[j + 2] * 0.114;
  const out = new Uint8ClampedArray(data.length);
  for (let y = 0; y < h; y++) {
    const a = Math.max(0, y - 1) * w, b = y * w, c = Math.min(h - 1, y + 1) * w;
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - 1), x1 = Math.min(w - 1, x + 1);
      const v = (g[a + x0] + g[a + x] + g[a + x1] + g[b + x0] + g[b + x] + g[b + x1] + g[c + x0] + g[c + x] + g[c + x1]) / 9;
      const k = (b + x) * 4; out[k] = out[k + 1] = out[k + 2] = v; out[k + 3] = 255;
    }
  }
  return new ImageData(out, w, h);
}
async function decodeImg(img) {
  const r = await ZXingWASM.readBarcodes(img, ZX_OPTS);
  return r && r.length ? r[0].text : null;
}
const scanCv = document.createElement('canvas');
const scanCx = scanCv.getContext('2d', { willReadFrequently: true });
async function scanFrame(video, n) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const vis = visibleRect(vw, vh);                           // on lit la bande centrale, celle du cadre blanc
  const bx = vis.x + vis.w * 0.06, by = vis.y + vis.h * 0.25, bw = vis.w * 0.88, bh = vis.h * 0.5;
  const s = Math.min(1, 1000 / bw);
  for (const k of (n % 2 ? [1, 0.7] : [1])) {               // 2 échelles, pour s'adapter à la distance
    const w = Math.max(40, Math.round(bw * s * k)), h = Math.max(20, Math.round(bh * s * k));
    scanCv.width = w; scanCv.height = h;
    scanCx.drawImage(video, bx, by, bw, bh, 0, 0, w, h);
    const img = scanCx.getImageData(0, 0, w, h);
    const t = (await decodeImg(img)) || (await decodeImg(blur3(img)));
    if (t) return t;
  }
  return null;
}
async function scanLoop(token) {
  let n = 0;
  while (scanning && token === scanToken) {
    const v = $('cam');
    if (v.readyState >= 2) {
      try {
        const code = await scanFrame(v, n++);
        if (code && scanning && token === scanToken) { onCode(code); return; }
      } catch (e) {}
    }
    await new Promise(r => setTimeout(r, 80));
  }
}
function onCode(code) {
  stopScan();
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  $('code').value = code;
  note(`Code lu : <b>${esc(code)}</b>. Recherche du produit…`);
  lookupOnce(code);
}

async function startScan() {
  if (scanning) { await stopScan(); return; }                // le bouton sert aussi à arrêter la caméra
  scanning = true;
  const token = ++scanToken;
  $('scanBtn').textContent = 'Arrêter la caméra';
  note('Ouverture de la caméra…');
  const fail = async html => { await stopScan(); note(html, 'err'); };
  if (!(await loadZX())) {
    zxReady = null;                                          // permet de réessayer
    if (token === scanToken) await fail("Le lecteur de code-barres n'a pas pu se charger (connexion ?). Recharge la page, ou saisis les chiffres du code-barres ci-dessous.");
    return;
  }
  if (token !== scanToken) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    await fail('Caméra indisponible ici (le site doit être ouvert en https).'); return;
  }
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    if (token !== scanToken) return;
    const n = (e && e.name) || '', m = String((e && e.message) || e || '');
    await fail(/NotAllowed|Permission/i.test(n + m)
        ? "La caméra est refusée. Autorise-la dans les réglages du navigateur pour ce site, puis réessaie."
      : /NotFound|Requested device not found/i.test(n + m) ? "Aucune caméra trouvée sur cet appareil."
      : /NotReadable|in use|Could not start/i.test(n + m) ? "La caméra est utilisée par une autre application. Ferme-la et réessaie."
      : "Caméra impossible à démarrer (" + esc(m.slice(0, 80)) + "). Saisis les chiffres du code-barres ci-dessous.");
    return;
  }
  if (token !== scanToken) { s.getTracks().forEach(t => t.stop()); return; }   // arrêté pendant l'attente
  stream = s;
  const v = $('cam');
  v.srcObject = s;
  $('reader').hidden = false;
  try { await v.play(); } catch (e) {}
  try {                                                      // mise au point continue, quand le téléphone la propose
    const t = s.getVideoTracks()[0], caps = t.getCapabilities ? t.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch (e) {}
  note('Place le code-barres dans le cadre, bien à plat, à 15 ou 20 cm. Pas lu ? Saisis les chiffres sous le code-barres, plus bas.');
  scanLoop(token);
}
async function stopScan() {
  scanning = false; scanToken++;
  $('scanBtn').textContent = 'Scanner un code-barres';
  const s = stream; stream = null;
  if (s) s.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
  const v = $('cam');
  try { v.pause(); v.srcObject = null; } catch (e) {}
  $('reader').hidden = true;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });   // économise la batterie

/* Open Food Facts : fiche produit (nom, marque, photo, Nutri-Score) */
const OFF_FIELDS = 'code,product_name,product_name_fr,generic_name,brands,image_front_small_url,nutriscore_grade';
function offToProduct(p, code) {
  return {
    code: code || p.code || '',
    nom: p.product_name_fr || p.product_name || p.generic_name || '',
    marque: (p.brands || '').split(',')[0].trim(),
    image: p.image_front_small_url || '',
    nutriscore: ['a', 'b', 'c', 'd', 'e'].includes(p.nutriscore_grade) ? p.nutriscore_grade : '',
  };
}

// Mémoire de l'appareil : un produit inconnu d'Open Food Facts, saisi une fois, est reconnu ensuite
let KNOWN = {};
try { KNOWN = JSON.parse(localStorage.getItem('frigo_known') || '{}'); } catch (e) {}
function remember(p) {
  if (!p.code || !p.nom) return;
  KNOWN[p.code] = { nom: p.nom, marque: p.marque, image: p.image, nutriscore: p.nutriscore };
  try { localStorage.setItem('frigo_known', JSON.stringify(KNOWN)); } catch (e) {}
}

function applyProduct(p) {
  draft = { image: p.image || '', nutriscore: p.nutriscore || '' };
  if (p.code) $('code').value = p.code;
  $('nom').value = p.nom || '';
  $('marque').value = p.marque || '';
  $('sugg').hidden = true;
  $('found').innerHTML = `<div class="found">${draft.image ? `<img src="${esc(draft.image)}" alt="">` : ''}
    <div><b>${esc(p.nom || 'Produit trouvé')}</b><br><small>${esc(p.marque)}${p.nutriscore ? ' · Nutri-Score ' + esc(p.nutriscore.toUpperCase()) : ''}</small></div></div>`;
  $('dlc').focus();
}

// Évite de relancer deux fois la même recherche (scan puis saisie, par exemple)
function lookupOnce(code) {
  code = String(code).replace(/\D/g, '');
  if (!code || code === lastLookup) return;
  lastLookup = code;
  lookup(code);
}
async function lookup(code) {
  code = String(code).trim();
  if (!code) return;
  if (KNOWN[code]) { applyProduct({ code, ...KNOWN[code] }); return; }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 10000);        // pas d'attente infinie
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`,
      { signal: ctl.signal });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (j && j.status === 1 && j.product) { applyProduct(offToProduct(j.product, code)); return; }
    if (r.status === 404 || (j && j.status === 0)) {        // Open Food Facts répond : produit absent de la base
      note(`Code <b>${esc(code)}</b> absent d'Open Food Facts. Saisis le nom ci-dessous : il sera reconnu au prochain scan.`);
      $('nom').focus();
      return;
    }
    note(`Open Food Facts a répondu une erreur (${r.status}). Saisis le nom à la main, ou réessaie dans un instant.`, 'err');
    $('nom').focus();
  } catch (e) {
    note(e && e.name === 'AbortError'
      ? "Open Food Facts met trop de temps à répondre. Saisis le nom à la main, ou réessaie."
      : "Impossible de joindre Open Food Facts (connexion ?). Saisis le nom à la main, ou réessaie.", 'err');
    $('nom').focus();
  } finally { clearTimeout(timer); }
}

// Recherche par nom (sur validation seulement : Open Food Facts limite les requêtes)
let SUGG = [];
async function searchOFF() {
  const q = $('search').value.trim();
  if (q.length < 2) return;
  const box = $('sugg');
  box.hidden = false;
  box.innerHTML = '<div class="none">Recherche en cours…</div>';
  try {
    const url = 'https://fr.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=10'
      + '&sort_by=unique_scans_n&tagtype_0=countries&tag_contains_0=contains&tag_0=france'
      + '&fields=' + OFF_FIELDS + '&search_terms=' + encodeURIComponent(q);
    const j = await (await fetch(url)).json();
    SUGG = (j.products || []).map(p => offToProduct(p)).filter(p => p.nom && p.code);
    box.innerHTML = SUGG.length
      ? SUGG.map((p, i) => `<button data-sg="${i}">${p.image ? `<img src="${esc(p.image)}" alt="">` : '<i></i>'}
          <span>${esc(p.nom)}<br><small>${esc(p.marque)}</small></span></button>`).join('')
      : '<div class="none">Aucun résultat. Saisis le produit à la main.</div>';
  } catch (e) { box.innerHTML = '<div class="none">Open Food Facts injoignable. Saisis le produit à la main.</div>'; }
}

/* ---------- Ajout / modification d'un produit ---------- */
let editId = null;     // null = ajout, sinon id du produit modifié
function resetForm() {
  editId = null; draft = {}; SUGG = []; lastLookup = '';
  ['code', 'nom', 'marque', 'dlc', 'search'].forEach(i => $(i).value = '');
  $('qte').value = 1; $('found').innerHTML = ''; $('sugg').hidden = true;
}
function openAdd() {
  resetForm();
  $('dlgAdd').classList.remove('editing');
  $('dlgTitle').textContent = 'Ajouter au frigo';
  $('saveAdd').textContent = 'Ajouter au frigo';
  $('dlgAdd').showModal();
  startScan();                                  // la caméra s'ouvre tout de suite, comme dans une app de scan
}
function openEdit(id) {
  const it = state.frigo.find(i => String(i.id) === String(id));
  if (!it) return;
  resetForm();
  editId = it.id;
  draft = { image: it.image || '', nutriscore: it.nutriscore || '' };
  $('code').value = it.code_barres || '';
  $('nom').value = it.nom || '';
  $('marque').value = it.marque || '';
  $('qte').value = it.quantite || 1;
  $('dlc').value = it.date_peremption || '';
  $('dlgAdd').classList.add('editing');
  $('dlgTitle').textContent = 'Modifier le produit';
  $('saveAdd').textContent = 'Enregistrer';
  $('dlgAdd').showModal();
}
async function saveAdd(next) {
  const nom = $('nom').value.trim();
  if (!nom) { toast('Indique le nom du produit.'); return; }
  const payload = {
    nom, marque: $('marque').value.trim(), quantite: $('qte').value, date_peremption: $('dlc').value,
    code_barres: $('code').value.trim(), image: draft.image || '', nutriscore: draft.nutriscore || '',
  };
  remember({ code: payload.code_barres, nom, marque: payload.marque, image: payload.image, nutriscore: payload.nutriscore });
  await stopScan();
  if (editId) {
    $('dlgAdd').close();
    toast('Modifié');
    api('updateFrigo', { id: editId, ...payload });
    return;
  }
  api('addFrigo', payload);
  if (next) {                                   // on enchaîne : formulaire vide, caméra rouverte
    resetForm();
    $('found').innerHTML = `<div class="found"><b>✓ ${esc(nom)} ajouté au frigo</b></div>`;
    startScan();
  } else {
    $('dlgAdd').close();
    toast('Ajouté au frigo');
  }
}

/* ---------- Événements ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + b.dataset.tab));
  $('fab').classList.toggle('on', b.dataset.tab === 'frigo');
  $('title').textContent = { frigo: 'Frigo', courses: 'Courses', recettes: 'Recettes', saison: 'De saison' }[b.dataset.tab];
  if (b.dataset.tab === 'recettes') { $('summary').textContent = 'Pour finir ce qui périme en premier'; renderRecettes(); }
  else if (b.dataset.tab === 'saison') { $('summary').textContent = 'Fruits et légumes du mois'; renderSaison(); }
  else if (b.dataset.tab === 'courses') { $('summary').textContent = 'À acheter'; }
  else renderFrigo();
});

$('fab').onclick = openAdd;
$('scanBtn').onclick = startScan;
// Saisie manuelle : la fiche se remplit dès que les 8, 12 ou 13 chiffres sont tapés
$('code').oninput = e => {
  const v = e.target.value.replace(/\D/g, '');
  if ([8, 12, 13].includes(v.length)) lookupOnce(v);
  else if (v.length < 8) lastLookup = '';
};
$('code').onchange = e => lookupOnce(e.target.value);
$('saveAdd').onclick = () => saveAdd(false);
$('saveNext').onclick = () => saveAdd(true);
$('searchBtn').onclick = searchOFF;
$('search').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); searchOFF(); } };
$('sugg').onclick = e => { const b = e.target.closest('[data-sg]'); if (b) applyProduct(SUGG[+b.dataset.sg]); };
$('cancelAdd').onclick = async () => { await stopScan(); $('dlgAdd').close(); };
$('dlgAdd').addEventListener('close', stopScan);
document.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => $('dlc').value = isoPlus(+b.dataset.plus));

$('frigo').onkeydown = e => {
  const ed = e.target.closest('.top[data-edit]');
  if (ed && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openEdit(ed.dataset.edit); }
};
$('frigo').onclick = e => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit); return; }
  const eat = e.target.closest('[data-eat]'), bin = e.target.closest('[data-bin]');
  if (eat) {
    const it = state.frigo.find(i => String(i.id) === eat.dataset.eat);
    if (Number(it.quantite) > 1) api('setQty', { id: it.id, quantite: Number(it.quantite) - 1 });
    else { api('removeFrigo', { id: it.id, consumed: true }); toast('Ajouté à la liste de courses'); }
  }
  if (bin) api('removeFrigo', { id: bin.dataset.bin, consumed: false });
};

$('getRec').onclick = getRecipes;
$('personnes').value = localStorage.getItem('frigo_people') || 4;
if (REC) $('getRec').textContent = 'Proposer d\'autres idées';
$('recettes').onclick = e => {
  const b = e.target.closest('[data-buy]');
  if (!b || !REC) return;
  const list = (REC.recettes[+b.dataset.buy] || {}).a_acheter || [];
  list.forEach(article => api('addCourse', { article, quantite: 1 }));
  toast(list.length > 1 ? 'Ingrédients ajoutés aux courses' : 'Ajouté aux courses');
};

$('addCourse').onclick = () => {
  const v = $('newCourse').value.trim(); if (!v) return;
  $('newCourse').value = ''; api('addCourse', { article: v, quantite: 1 });
};
$('newCourse').onkeydown = e => { if (e.key === 'Enter') $('addCourse').click(); };
$('courses').onclick = e => {
  const t = e.target.closest('[data-tog]'), d = e.target.closest('[data-del]');
  if (t) api('toggleCourse', { id: t.dataset.tog });
  if (d) api('removeCourse', { id: d.dataset.del });
};
$('clearDone').onclick = () => api('clearDone');
$('months').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { moisSel = +b.dataset.m; renderSaison(); } };

$('saveCfg').onclick = () => {
  const url = DEFAULT_URL || $('cfgUrl').value.trim();
  const pin = $('cfgPin').value;
  if (!url || !pin) { toast(url ? 'Saisis ton code secret.' : "Saisis l'adresse de l'API et ton code."); return; }
  CFG = { url, pin };
  try { localStorage.setItem('frigo_cfg', JSON.stringify(CFG)); } catch (e) {}
  $('dlgCfg').close(); api('list');
};

/* ---------- Démarrage ---------- */
render();
if (!CFG.url || !CFG.pin) openCfg(); else api('list');
document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG.url && CFG.pin) api('list'); });
</script>
